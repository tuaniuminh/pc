name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@main

      - name: Kiểm tra môi trường Node.js
        run: |
          node -v
          npm -v

      - name: Cài đặt Dependencies
        run: npm install

      - name: Build Web (Vite)
        run: npm run build

      - name: Khởi tạo & Đồng bộ Capacitor
        run: |
          rm -rf ios || true
          npx cap add ios
          npx cap sync ios

      - name: Kích hoạt LaunchScreen & 120Hz ProMotion trên iPhone 14 Pro Max
        run: |
          echo "Kích hoạt UILaunchStoryboardName để hiển thị đúng độ phân giải gốc của iPhone 14 Pro Max"
          /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" ios/App/App/Info.plist || true

      - name: Kích hoạt Live Activities, Dynamic Island & Background Audio (iOS 16.1+)
        run: |
          echo "Bật cờ NSSupportsLiveActivities và NSSupportsLiveActivitiesFrequentUpdates trong Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivitiesFrequentUpdates bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivitiesFrequentUpdates true" ios/App/App/Info.plist || true
          
          echo "Kích hoạt phát âm thanh nền Background Audio khi ẩn ứng dụng"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/App/App/Info.plist || true

          echo "Đăng ký URL Scheme pcflex để mở app từ Dynamic Island"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string pcflex" ios/App/App/Info.plist || true

          echo "Đồng bộ AppDelegate.swift tùy chỉnh với AVAudioSession và xử lý dọn dẹp Live Activities"
          cp ios-native/AppDelegate.swift ios/App/App/AppDelegate.swift || true

      - name: Tích hợp Widget Extension (Dynamic Island & Live Activities) vào Xcode
        run: |
          echo "Thiết lập Widget Extension cho ActivityKit"
          ruby << 'EOF'
            require 'xcodeproj'
            require 'fileutils'

            project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            main_target = project.targets.find { |t| t.name == 'App' }

            FileUtils.mkdir_p('ios/App/PCFlexWidget')
            FileUtils.cp_r(Dir.glob('ios-native/PCFlexWidget/*'), 'ios/App/PCFlexWidget/')

            widget_target = project.targets.find { |t| t.name == 'PCFlexWidget' } || project.new_target(:app_extension, 'PCFlexWidget', :ios, '16.1')
            widget_group = project.main_group.find_subpath('PCFlexWidget', true)
            widget_group.set_source_tree('SOURCE_ROOT')
            widget_group.set_path('PCFlexWidget')

            widget_target.build_configurations.each do |config|
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.pcflex.app.widget'
              config.build_settings['INFOPLIST_FILE'] = 'PCFlexWidget/Info.plist'
              config.build_settings['SWIFT_VERSION'] = '5.0'
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.1'
              config.build_settings['SKIP_INSTALL'] = 'YES'
              config.build_settings['TARGETED_DEVICE_FAMILY'] = '1,2'
              config.build_settings['ENABLE_BITCODE'] = 'NO'
              config.build_settings['GENERATE_INFOPLIST_FILE'] = 'NO'
              config.build_settings['OTHER_LDFLAGS'] = ['-framework', 'WidgetKit', '-framework', 'ActivityKit', '-framework', 'SwiftUI']
            end

            Dir.glob('ios/App/PCFlexWidget/*.swift').each do |file|
              filename = File.basename(file)
              file_ref = widget_group.find_file_by_path(filename) || widget_group.new_file(filename)
              widget_target.add_file_references([file_ref]) unless widget_target.source_build_phase.files_references.include?(file_ref)
            end

            puts "=== CÁC FILE SWIFT TRONG WIDGET TARGET ==="
            puts widget_target.source_build_phase.files_references.map(&:path)

            # Tạo Shared Scheme cho PCFlexWidget để xcodebuild có thể biên dịch trong Workspace
            scheme = Xcodeproj::XCScheme.new
            scheme.add_build_target(widget_target)
            scheme.save_as('ios/App/App.xcodeproj', 'PCFlexWidget', true)

            # Nhúng Widget Extension vào App chính
            main_target.add_dependency(widget_target)
            embed_phase = main_target.copy_files_build_phases.find { |p| p.dst_subfolder_spec == 13 } || main_target.new_copy_files_build_phase('Embed App Extensions')
            embed_phase.dst_subfolder_spec = 13
            product_ref = widget_target.product_reference
            embed_phase.add_file_reference(product_ref) unless embed_phase.files_references.include?(product_ref)

            project.save
          EOF

      - name: Tạo Icon tự động từ Logo
        run: npm run generate-icons || true

      - name: Đọc và đồng bộ Version từ package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Cập nhật MARKETING_VERSION = $VERSION vào Xcode project"
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $VERSION;/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Build mã nguồn iOS & Widget Extension bằng Xcode (Không ký)
        working-directory: ios/App
        run: |
          # 1. Build Target PCFlexWidget thông qua Scheme đã tạo trong Workspace
          echo "Đang biên dịch Widget Extension PCFlexWidget..."
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme PCFlexWidget \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          # 2. Build Main App Target bằng Workspace
          echo "Đang biên dịch App chính..."
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          # 3. Đảm bảo thư mục PlugIns chứa PCFlexWidget.appex
          mkdir -p build/Build/Products/Release-iphoneos/App.app/PlugIns
          if [ -d "build/Build/Products/Release-iphoneos/PCFlexWidget.appex" ]; then
            cp -r build/Build/Products/Release-iphoneos/PCFlexWidget.appex build/Build/Products/Release-iphoneos/App.app/PlugIns/
            echo "Đã sao chép thành công PCFlexWidget.appex vào App.app/PlugIns/"
          fi

          echo "Danh sách tệp trong PlugIns:"
          ls -la build/Build/Products/Release-iphoneos/App.app/PlugIns

          # Kiểm tra bắt buộc: Nếu PlugIns không có PCFlexWidget.appex thì dừng build ngay
          test -d "build/Build/Products/Release-iphoneos/App.app/PlugIns/PCFlexWidget.appex" || (echo "LỖI: PCFlexWidget.appex không tồn tại trong PlugIns!" && exit 1)

      - name: Ký mã giả (Ad-Hoc) với Entitlements cho TrollStore
        run: |
          # Cấp quyền thực thi 755 cho toàn bộ nhị phân
          chmod -R 755 ios/App/build/Build/Products/Release-iphoneos/App.app
          if [ -d "ios/App/build/Build/Products/Release-iphoneos/App.app/PlugIns/PCFlexWidget.appex" ]; then
            echo "Ký mã giả cho Widget Extension PCFlexWidget.appex"
            codesign --force --sign - --entitlements ios-build-entitlements.plist ios/App/build/Build/Products/Release-iphoneos/App.app/PlugIns/PCFlexWidget.appex
          fi
          codesign --force --sign - --deep --entitlements ios-build-entitlements.plist ios/App/build/Build/Products/Release-iphoneos/App.app

      - name: Đóng gói thành file IPA chuẩn
        run: |
          echo "Đang đóng gói IPA phiên bản: v${{ env.APP_VERSION }}"
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          
          # Đặt tên file IPA chuẩn (Ví dụ: PCFlex-v1.3.0.ipa)
          IPA_NAME="PCFlex-v${{ env.APP_VERSION }}.ipa"
          zip -r "$IPA_NAME" Payload
          rm -rf Payload
          
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Tải file IPA lên GitHub Artifacts
        uses: actions/upload-artifact@main
        with:
          name: PCFlex-v${{ env.APP_VERSION }}
          path: ${{ env.IPA_NAME }}
          retention-days: 14

      - name: Xuất bản tệp IPA trực tiếp lên GitHub Releases (Không nén zip)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: PC Flex v${{ env.APP_VERSION }}
          files: ${{ env.IPA_NAME }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 PC Flex v${{ env.APP_VERSION }}
            - Tải trực tiếp tệp IPA chuẩn không cần giải nén zip.
            - Hỗ trợ cài đặt trực tiếp qua TrollStore trên iOS 16.6+ (iPhone 14 Pro Max).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
