name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@main

      - name: Kiểm tra môi trường Node.js
        run: |
          node -v
          npm -v

      - name: Cài đặt Dependencies
        run: npm install

      - name: Build Web (Vite)
        run: npm run build

      - name: Khởi tạo & Đồng bộ Capacitor
        run: |
          rm -rf ios || true
          npx cap add ios
          npx cap sync ios

      - name: Kích hoạt hỗ trợ màn hình 120Hz ProMotion trên iPhone / iPad
        run: |
          echo "Bật cờ CADisableMinimumFrameDurationOnPhone để mở khóa 120Hz ProMotion"
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" ios/App/App/Info.plist || true

      - name: Kích hoạt Live Activities, Dynamic Island & Background Audio (iOS 16.1+)
        run: |
          echo "Bật cờ NSSupportsLiveActivities và NSSupportsLiveActivitiesFrequentUpdates trong Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivitiesFrequentUpdates bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivitiesFrequentUpdates true" ios/App/App/Info.plist || true
          
          echo "Kích hoạt phát âm thanh nền Background Audio khi ẩn ứng dụng"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/App/App/Info.plist || true

          echo "Tích hợp và đăng ký mã nguồn Native (Swift & Obj-C) vào Xcode project"
          cp ios-native/*.* ios/App/App/ || true
          ruby -r xcodeproj -e "
            project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            target = project.targets.first
            group = project.main_group.find_subpath('App', true)
            
            # Đăng ký -ObjC để nạp đầy đủ Objective-C Bridge Category
            target.build_configurations.each do |config|
              flags = config.build_settings['OTHER_LDFLAGS'] || ['$(inherited)']
              flags = [flags] if flags.is_a?(String)
              flags << '-ObjC' unless flags.include?('-ObjC')
              config.build_settings['OTHER_LDFLAGS'] = flags
            end

            Dir.glob('ios-native/*.*').each do |file|
              dest = \"ios/App/App/#{File.basename(file)}\"
              FileUtils.cp(file, dest)
              file_ref = group.find_file_by_path(File.basename(file)) || group.new_file(File.basename(file))
              target.add_file_references([file_ref]) unless target.source_build_phase.files_references.include?(file_ref)
            end
            project.save
          " || cp ios-native/*.* ios/App/App/

          echo "Đồng bộ Main.storyboard với MainViewController"
          sed -i '' 's/customClass="CAPBridgeViewController"/customClass="MainViewController"/g' ios/App/App/Base.lproj/Main.storyboard || true
          sed -i '' 's/customModule="Capacitor"/customModule="App"/g' ios/App/App/Base.lproj/Main.storyboard || true

      - name: Tạo Icon tự động từ Logo
        run: npm run generate-icons || true

      - name: Đọc và đồng bộ Version từ package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Cập nhật MARKETING_VERSION = $VERSION vào Xcode project"
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $VERSION;/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Build mã nguồn iOS bằng Xcode (Không ký)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Ký mã giả (Ad-Hoc) với Entitlements cho TrollStore
        run: |
          codesign --force --sign - --deep --entitlements ios-build-entitlements.plist ios/App/build/Build/Products/Release-iphoneos/App.app

      - name: Đóng gói thành file IPA chuẩn
        run: |
          echo "Đang đóng gói IPA phiên bản: v${{ env.APP_VERSION }}"
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          
          # Đặt tên file IPA chuẩn (Ví dụ: PCFlex-v1.3.0.ipa)
          IPA_NAME="PCFlex-v${{ env.APP_VERSION }}.ipa"
          zip -r "$IPA_NAME" Payload
          rm -rf Payload
          
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Tải file IPA lên GitHub Artifacts
        uses: actions/upload-artifact@main
        with:
          name: PCFlex-v${{ env.APP_VERSION }}
          path: ${{ env.IPA_NAME }}
          retention-days: 14
